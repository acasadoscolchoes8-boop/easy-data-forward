name: Publicar na Kinghost

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - stable-website

concurrency:
  group: kinghost-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Validar e publicar
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Gerar pacote estático
        run: npm run build:kinghost

      - name: Publicar por FTP/FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.KINGHOST_FTP_SERVER }}
          username: ${{ secrets.KINGHOST_FTP_USERNAME }}
          password: ${{ secrets.KINGHOST_FTP_PASSWORD }}
          protocol: ${{ vars.KINGHOST_FTP_PROTOCOL || 'ftps' }}
          port: ${{ vars.KINGHOST_FTP_PORT || 21 }}
          local-dir: ./dist-kinghost/
          server-dir: ${{ vars.KINGHOST_FTP_DIRECTORY || '/www/' }}
          

      - name: Confirmar site publicado
        env:
          SITE_URL: ${{ vars.KINGHOST_SITE_URL || 'https://mannescolchoes.com.br' }}
        run: |
          for path in / /produtos /escolha-ideal /tecnologias /mannes /contato; do
            page="$(curl --fail --silent --show-error --location \
              --retry 6 --retry-all-errors --retry-delay 10 \
              "${SITE_URL}${path}")"
            test "${#page}" -gt 10000
            if printf '%s' "$page" | grep -q '_shell.html'; then
              echo "Arquivo antigo detectado em ${path}."
              exit 1
            fi
          done
